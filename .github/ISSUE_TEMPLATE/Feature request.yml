name: Feature request
description: Suggest a new feature or improvement for this project
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - Nasraell
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature! Please fill out the details below as clearly as you can.

  - type: checkboxes
    id: existing-issue-check
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if a similar feature request already exists before opening a new one.
      options:
        - label: I have searched the existing issues and this feature has not already been requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve, or why is this feature needed?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request here.
    validations:
      required: false
